<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Gopika is a product manager moving into B2B SaaS. A portfolio of product thinking, independent exercises, and a warm invitation to talk."
    />
    <meta name="theme-color" content="#FAF7F2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=Kalam:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <title>Gopika — Product Manager</title>
  </head>
  <body>
    <script>
      // Restore the real path after GitHub Pages serves 404.html for a client route.
      ;(function (location) {
        if (location.search[1] === "/") {
          var decoded = location.search
            .slice(1)
            .split("&")
            .map(function (part) {
              return part.replace(/~and~/g, "&")
            })
            .join("?")
          window.history.replaceState(null, "", location.pathname.slice(0, -1) + decoded + location.hash)
        }
      })(window.location)
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
